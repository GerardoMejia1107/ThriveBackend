spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: thrive
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: ${DB_URI}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: michael
      password: holly

logging:
  level:
    org.springframework.security: TRACE

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}